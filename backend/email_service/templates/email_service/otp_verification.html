<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 100%;
              max-width: 560px;
              background: #ffffff;
              border-radius: 14px;
              overflow: hidden;
              box-shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
            "
          >
            <tr>
              <td style="background: #0f172a; padding: 24px 28px">
                <h2 style="margin: 0; color: #ffffff; font-size: 22px">
                  Smart Recruitment
                </h2>
                <p style="margin: 8px 0 0; color: #cbd5e1; font-size: 14px">
                  {{ entity_label }} verification
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px">
                <p style="margin: 0 0 12px; font-size: 15px; color: #374151">
                  Hi {{ recipient_name }},
                </p>
                <p
                  style="
                    margin: 0 0 18px;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #374151;
                  "
                >
                  Use the OTP below to verify your {{ entity_label|lower }}.
                  This OTP is valid for
                  <strong>10 minutes</strong>.
                </p>
                <div
                  style="
                    display: inline-block;
                    padding: 12px 18px;
                    border-radius: 10px;
                    background: #e2e8f0;
                    font-size: 28px;
                    letter-spacing: 8px;
                    font-weight: 700;
                    color: #0f172a;
                  "
                >
                  {{ otp_code }}
                </div>
                <p style="margin: 20px 0 0; font-size: 13px; color: #6b7280">
                  If you did not request this OTP, you can safely ignore this
                  email.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 18px 28px;
                  border-top: 1px solid #e5e7eb;
                  background: #f8fafc;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #94a3b8">
                  &copy; {{ current_year }} Smart Recruitment
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
