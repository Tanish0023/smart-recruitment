<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f6f8fc;
      font-family: Arial, sans-serif;
      color: #1f2937;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 24px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="padding: 24px 24px 8px 24px">
                <h2
                  style="
                    margin: 0;
                    font-size: 22px;
                    line-height: 1.3;
                    color: #111827;
                  "
                >
                  Application Received
                </h2>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 8px 24px 24px 24px;
                  font-size: 15px;
                  line-height: 1.6;
                  color: #374151;
                "
              >
                <p style="margin: 0 0 12px 0">Hi {{ username }},</p>
                <p style="margin: 0 0 12px 0">
                  We have successfully received your application for
                  <strong>{{ job_title }}</strong>.
                </p>
                <p style="margin: 0 0 20px 0">
                  You can track updates from your dashboard anytime.
                </p>
                <p style="margin: 0 0 20px 0">
                  <a
                    href="{{ dashboard_url }}"
                    style="
                      display: inline-block;
                      background: #4f46e5;
                      color: #ffffff;
                      text-decoration: none;
                      padding: 10px 16px;
                      border-radius: 8px;
                      font-weight: 600;
                    "
                    >View My Applications</a
                  >
                </p>
                <p style="margin: 0; color: #6b7280">
                  Thanks,<br />Smart Recruitment Team
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 14px 24px;
                  background: #f9fafb;
                  border-top: 1px solid #e5e7eb;
                  font-size: 12px;
                  color: #9ca3af;
                "
              >
                © {{ current_year }} Smart Recruitment. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
