services:
  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: smart-recruitment-backend:latest
    restart: unless-stopped
    command: sh entrypoint.sh
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery:
    image: smart-recruitment-backend:latest
    container_name: celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info -Q resume_parsing --concurrency=1 --prefetch-multiplier=1 --without-gossip --without-mingle --without-heartbeat
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery_email:
    image: smart-recruitment-backend:latest
    container_name: celery_email_worker
    restart: unless-stopped
    command: celery -A core worker -l info -Q email_service --concurrency=1 --prefetch-multiplier=1 --without-gossip --without-mingle --without-heartbeat
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery_questions:
    image: smart-recruitment-backend:latest
    container_name: celery_questions_worker
    restart: unless-stopped
    command: celery -A core worker -l info -Q get-questions --concurrency=1 --prefetch-multiplier=1 --without-gossip --without-mingle --without-heartbeat
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "while :; do
      certbot renew;
      sleep 12h;
      done"

volumes:
  redis_data:
