events {}

http {
    upstream django_backend {
        least_conn;
        server backend:8000;
    }

    server {
        listen 80;
        server_name job-api.tanishportfolio.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name job-api.tanishportfolio.in;

        ssl_certificate /etc/letsencrypt/live/job-api.tanishportfolio.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/job-api.tanishportfolio.in/privkey.pem;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://django_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
        }
    }
}